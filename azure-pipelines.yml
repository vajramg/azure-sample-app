trigger:
  branches:
    include:
      - main

  paths:
    include:
      - app/**
      - manifests/**
      - azure-pipelines-app.yml

    exclude:
      - terraform/**
 

variables:
   imageName: myapp
   acr: vg1988myacr
   repositry:  
     
stages:
  - stage: build
    jobs:
      - job: build_push
        pool:
         vmImage: 'ubuntu-latest'
        steps:
           - task: AzureCLI@2
             inputs:
               connectionType: 'azureRM'
               azureSubscription: 'az-resource'
               scriptType: 'bash'
               scriptLocation: 'inlineScript'
               inlineScript: |
                az acr login  --name $(acr)
                 docker build -t $(acr).azurecr.io/$(imageName):$(Build.BuildId) ./app
                 docker push $(acr).azurecr.io/$(imageName):$(Build.BuildId)
  - stage:  deploy
    dependsOn: build
    jobs:
     - job: deploy
       pool:
        vmImage: 'ubuntu-latest'
       steps:
         - task: AzureCLI@3
           inputs:
             connectionType: 'azureRM'
             azureSubscription: 'az-resource'
             scriptType: 'bash'
             scriptLocation: 'inlineScript'
             inlineScript: |
               CLIENT_ID=$(az aks show \
               -g aks-rg \
               -n myaks-cluster \
               --query addonProfiles.azureKeyvaultSecretsProvider.identity.clientId \
                -o tsv)
                echo "AKS Key Vault Identity: $CLIENT_ID"
                sed -i "s/#{CLIENT_ID}#/$CLIENT_ID/g" manifests/secret-provider.yaml
                cat manifests/secret-provider.yaml
        
         - task: KubernetesManifest@1
           inputs:
             action: 'deploy'
             connectionType: 'azureResourceManager'
             azureSubscriptionConnection: 'az-resource'
             azureResourceGroup: 'aks-rg'
             kubernetesCluster: 'myaks-cluster'
             namespace: 'default'
             manifests: |
              manifests/flask-deployment.yaml
              manifests/azure.yaml
              manifests/flask-service.yaml
              manifests/ingress.yaml
              manifests/postgres-secret.yaml
              manifests/pvc.yaml
              manifests/secret-provider.yaml
              manifests/service.yaml
              manifests/statefulset.yaml
             containers: 'vg1988myacr.azurecr.io/myapp:$(Build.BuildId)'
             imagePullSecrets: ''
             
         - task: AzureCLI@2
           inputs:
                connectionType: ''
                azureSubscription: 'az-resource'
                scriptType: 'bash'
                scriptLocation: 'inlineScript'
                inlineScript: |
                   az aks get-credentials --resource-group aks-rg --name myaks-cluster --overwrite-existing
                   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
                  
                   kubectl get nodes
                  
                   helm repo update
                  
                   helm install ingress-nginx ingress-nginx/ingress-nginx \
                    --namespace ingress-nginx \
                    --create-namespace
         
                 
